<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dff1ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>韓国語単語帳</title>
  <link rel="stylesheet" href="style.css?v=20260727-flashcards">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <p class="eyebrow">OFFLINE STUDY APP</p>
      <h1>韓国語単語帳</h1>
      <p class="sub">カードをタップして答えを確認</p>
      <nav class="page-nav" aria-label="ページ移動">
        <a class="page-nav-link" href="index.html">クイズ</a>
        <a class="page-nav-link active" href="flashcards.html">単語帳</a>
      </nav>
    </div>
  </header>

  <main class="app-shell flashcard-shell">
    <section class="panel flashcard-controls">
      <h2>表示する単語</h2>
      <div class="chip-grid" id="flashLessonChips">
        <label class="check-chip"><input type="checkbox" value="5" checked><span>第5課</span></label>
        <label class="check-chip"><input type="checkbox" value="6" checked><span>第6課</span></label>
        <label class="check-chip"><input type="checkbox" value="7" checked><span>第7課</span></label>
      </div>
      <div class="flash-filter-grid">
        <label class="select-label">絞り込み
          <select id="cardFilter">
            <option value="all">すべて</option>
            <option value="unlearned">未習得だけ</option>
            <option value="learned">覚えた単語だけ</option>
            <option value="difficult">苦手度3以上</option>
            <option value="memo">メモありだけ</option>
          </select>
        </label>
        <label class="select-label">カードの表
          <select id="frontMode">
            <option value="korean">韓国語</option>
            <option value="japanese">日本語</option>
            <option value="random">ランダム</option>
          </select>
        </label>
      </div>
      <div class="flash-control-buttons">
        <button type="button" id="shuffleBtn" class="secondary-btn">🔀 シャッフル</button>
        <button type="button" id="resetCardsBtn" class="secondary-btn">先頭に戻る</button>
      </div>
    </section>

    <section id="emptyCards" class="notice hidden">条件に合う単語がありません。出題範囲や絞り込みを変えてください。</section>

    <section id="flashcardStudy" class="flashcard-study">
      <div class="flashcard-progress"><strong id="cardPosition">1 / 1</strong><span id="cardStatus"></span></div>

      <button type="button" id="flashcard" class="flashcard" aria-label="カードを裏返す" aria-pressed="false">
        <span class="flashcard-side-label" id="frontLabel">韓国語</span>
        <strong id="frontText" class="flashcard-main"></strong>
        <span id="frontHint" class="flashcard-tap-hint">タップして答えを見る</span>
        <span id="backArea" class="flashcard-back hidden">
          <span class="flashcard-divider"></span>
          <span class="flashcard-side-label" id="backLabel">日本語</span>
          <strong id="backText" class="flashcard-answer"></strong>
          <small id="cardExplanation"></small>
        </span>
      </button>

      <div class="flash-nav-buttons">
        <button type="button" id="prevCardBtn" class="secondary-btn">← 前へ</button>
        <button type="button" id="flipCardBtn" class="primary-btn">答えを見る</button>
        <button type="button" id="nextCardBtn" class="secondary-btn">次へ →</button>
      </div>

      <section class="study-note-panel" aria-label="単語メモ">
        <div class="study-note-heading">
          <div><strong>📝 この単語の自分メモ</strong><small>クイズページと共通で保存されます</small></div>
          <span id="flashNoteStatus" class="note-save-status" aria-live="polite"></span>
        </div>
        <textarea id="flashMemo" rows="3" placeholder="語呂合わせ・覚えるコツ・先生の注意など"></textarea>
        <div class="study-settings">
          <fieldset class="difficulty-field">
            <legend>苦手度</legend>
            <div id="flashDifficultyButtons" class="difficulty-buttons" aria-label="苦手度">
              <button type="button" data-level="1">★</button><button type="button" data-level="2">★</button><button type="button" data-level="3">★</button><button type="button" data-level="4">★</button><button type="button" data-level="5">★</button>
            </div>
          </fieldset>
          <label class="learned-check"><input type="checkbox" id="flashLearned"><span>✅ 覚えた</span></label>
        </div>
        <button type="button" id="saveFlashNoteBtn" class="save-note-btn">この単語のメモを保存</button>
      </section>
    </section>
  </main>

  <noscript><p class="fatal">JavaScriptを有効にしてください。</p></noscript>
  <script src="questions.js?v=20260727-flashcards"></script>
  <script src="flashcards.js?v=20260727-flashcards"></script>
</body>
</html>
